[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rxn-classifier"
version = "0.1.0"
description = "Five-agent LLM pipeline that classifies chemical reactions and grows the class hierarchy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.45.0",
    "pandas>=2.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
tracking = ["wandb", "weave>=0.52.10"]
rdkit = ["rdkit"]
yaml = ["pyyaml"]
test = ["pytest"]

[project.scripts]
rxn-classify = "rxn_classifier.classification.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
